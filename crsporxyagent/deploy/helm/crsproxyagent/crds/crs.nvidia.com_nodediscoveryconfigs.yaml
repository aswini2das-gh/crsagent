apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodediscoveryconfigs.crs.nvidia.com
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: crs.nvidia.com
  names:
    kind: NodeDiscoveryConfig
    listKind: NodeDiscoveryConfigList
    plural: nodediscoveryconfigs
    singular: nodediscoveryconfig
    shortNames:
      - ndc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ClusterID
          type: string
          jsonPath: .spec.clusterID
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: NodeCount
          type: integer
          jsonPath: .status.discoveredNodeCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: NodeDiscoveryConfig is the Schema for the nodediscoveryconfigs API.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: NodeDiscoveryConfigSpec defines the desired state of NodeDiscoveryConfig.
              type: object
              required:
                - clusterID
                - pollInterval
                - discoverCPU
                - discoverGPU
                - discoverStorage
                - discoverCloudProvider
                - kafkaBrokers
                - kafkaAuthSecret
              properties:
                clusterID:
                  description: ClusterID is the unique identifier for the cluster being discovered.
                  type: string
                  minLength: 1
                pollInterval:
                  description: PollInterval is the interval at which node discovery is performed.
                  type: string
                  default: "5m"
                nodeSelector:
                  description: NodeSelector filters which nodes are included in discovery.
                  type: object
                  additionalProperties:
                    type: string
                discoverCPU:
                  description: DiscoverCPU enables CPU resource discovery on nodes.
                  type: boolean
                  default: true
                discoverGPU:
                  description: DiscoverGPU enables GPU resource discovery on nodes.
                  type: boolean
                  default: false
                discoverStorage:
                  description: DiscoverStorage enables storage resource discovery on nodes.
                  type: boolean
                  default: true
                discoverCloudProvider:
                  description: DiscoverCloud enables cloud provider metadata discovery on nodes.
                  type: boolean
                  default: true
                kafkaBrokers:
                  description: KafkaBrokers is the list of Kafka broker addresses for publishing discovery events. May be empty to run with a local no-op publisher (e.g. for development).
                  type: array
                  items:
                    type: string
                kafkaAuthSecret:
                  description: KafkaAuthSecret is the name of the Secret containing Kafka authentication credentials.
                  type: string
            status:
              description: NodeDiscoveryConfigStatus defines the observed state of NodeDiscoveryConfig.
              type: object
              properties:
                phase:
                  description: Phase represents the current phase of the discovery process.
                  type: string
                lastReconcileTime:
                  description: LastReconcileTime is the timestamp of the last successful reconciliation.
                  type: string
                  format: date-time
                discoveredNodeCount:
                  description: DiscoveredNodeCount is the number of nodes discovered in the cluster.
                  type: integer
                conditions:
                  description: Conditions represent the latest available observations of the resource's state.
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
