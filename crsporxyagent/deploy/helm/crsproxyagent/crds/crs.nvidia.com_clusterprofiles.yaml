apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterprofiles.crs.nvidia.com
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: crs.nvidia.com
  names:
    kind: ClusterProfile
    listKind: ClusterProfileList
    plural: clusterprofiles
    singular: clusterprofile
    shortNames:
      - cp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ClusterID
          type: string
          jsonPath: .spec.clusterID
        - name: TotalNodes
          type: integer
          jsonPath: .status.totalNodes
        - name: ReadyNodes
          type: integer
          jsonPath: .status.readyNodes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: ClusterProfile is the Schema for the clusterprofiles API. It is a status-only resource created and maintained by the operator.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: ClusterProfileSpec defines the desired state of ClusterProfile.
              type: object
              required:
                - clusterID
              properties:
                clusterID:
                  description: ClusterID is the unique identifier for the cluster this profile represents.
                  type: string
                  minLength: 1
            status:
              description: ClusterProfileStatus defines the observed state of ClusterProfile.
              type: object
              properties:
                totalNodes:
                  description: TotalNodes is the total number of nodes in the cluster.
                  type: integer
                readyNodes:
                  description: ReadyNodes is the number of nodes in Ready state.
                  type: integer
                totalCPUCores:
                  description: TotalCPUCores is the aggregate CPU cores across all nodes.
                  type: integer
                  format: int64
                totalMemoryBytes:
                  description: TotalMemoryBytes is the aggregate memory in bytes across all nodes.
                  type: integer
                  format: int64
                cloudProvider:
                  description: CloudProvider is the detected cloud provider for the cluster.
                  type: string
                nodeSummaries:
                  description: NodeSummaries contains a summary of each discovered node.
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        description: Name is the node's name.
                        type: string
                      uid:
                        description: UID is the node's unique identifier.
                        type: string
                      cpuCores:
                        description: CPUCores is the number of CPU cores on this node.
                        type: integer
                        format: int64
                      memoryBytes:
                        description: MemoryBytes is the total memory in bytes on this node.
                        type: integer
                        format: int64
                      architecture:
                        description: Architecture is the CPU architecture (e.g., amd64, arm64).
                        type: string
                      os:
                        description: OS is the operating system running on this node.
                        type: string
                      kernelVersion:
                        description: KernelVersion is the kernel version of this node.
                        type: string
                      ready:
                        description: Ready indicates whether the node is in Ready condition.
                        type: boolean
                      cloudProvider:
                        description: CloudProvider is the cloud provider for this node.
                        type: string
                      instanceType:
                        description: InstanceType is the cloud instance type of this node.
                        type: string
                      region:
                        description: Region is the cloud region where this node is located.
                        type: string
                      zone:
                        description: Zone is the availability zone where this node is located.
                        type: string
                lastUpdateTime:
                  description: LastUpdateTime is the timestamp of the last status update.
                  type: string
                  format: date-time
                conditions:
                  description: Conditions represent the latest available observations of the resource's state.
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
